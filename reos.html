  out += '<div class="card"><div class="spread"><h3 style="margin:0">발주</h3>'+
    '<button class="chip sm" onclick="editPo(null)">+ 발주서</button></div>';

    out += '<div class="empty" style="padding:20px"><b>발주서가 없습니다</b>'+
      '견적을 확정하면 발주서를 만듭니다.<br>만들면 <b>외주 제작비가 원가에 저절로</b> 들어갑니다.</div>';
  }else{
    out += '<div style="margin-top:8px">'+pos.map(o=>{
      const s=supOf(o.supplier_id), m=cur.pmoney[o.id]||{}, st=PO_STAT[o.status];
      return '<button class="li" onclick="editPo(\''+o.id+'\')" style="width:100%">'+
        '<span class="ic">'+esc((s&&s.name||'?').slice(0,2))+'</span>'+
        '<span class="lb"><b>'+esc(s?s.name:'—')+'</b><span>'+esc(o.no||'')+
          (o.due_on?' · 납기 '+dfull(o.due_on):'')+
          (o.qty?' · '+num(o.qty)+' EA':'')+'</span></span>'+
        '<span class="rt">'+(canMoney()&&m.total?'<b>'+won(m.total)+'</b>':'')+
          '<span class="tag '+st.c+'">'+st.n+'</span></span></button>';
    }).join('')+'</div>';
  }
  out += '</div>';
  return out;
}
function cmpTable(list){
  const cols=list.map(r=>({r, s:supOf(r.supplier_id), m:cur.rmoney[r.id]||{}}));
  const rows=[];
  const money=canMoney();
  if(money){
    rows.push({n:'제작비', v:cols.map(c=>Number(c.m.make_cost)||0), fmt:won, low:true});
    rows.push({n:'샘플비', v:cols.map(c=>Number(c.m.sample_cost)||0), fmt:won, low:true});
    rows.push({n:'금형비', v:cols.map(c=>Number(c.m.mold_cost)||0), fmt:won, low:true});
    rows.push({n:'단가',   v:cols.map(c=>Number(c.m.unit_price)||0), fmt:won, low:true});
  }
  rows.push({n:'납기(일)', v:cols.map(c=>Number(c.r.lead_days)||0), fmt:v=>v?v+'일':'—', low:true});
  rows.push({n:'MOQ',     v:cols.map(c=>Number(c.r.moq)||0), fmt:v=>v?num(v):'—', low:true});
  rows.push({n:'결제조건', v:cols.map(c=>c.r.pay_term||'—'), fmt:v=>esc(v), low:null});
  rows.push({n:'평가점수', v:cols.map(c=>supScore(c.r.supplier_id)), fmt:v=>v===null?'—':v+'점', low:false});

  return '<h3 style="margin:14px 0 8px">견적 비교</h3>'+
   '<div class="cmp"><table><thead><tr><th style="text-align:left">항목</th>'+
    cols.map(c=>'<th'+(c.r.status==='won'?' class="win"':'')+'>'+esc(c.s?c.s.name:'—')+
      (c.r.status==='won'?'<br><span class="tag green">확정</span>':'')+'</th>').join('')+
   '</tr></thead><tbody>'+
    rows.map(row=>{
      const nums=row.v.filter(x=>typeof x==='number' && x>0);
      let best=null;
      if(row.low===true && nums.length)  best=Math.min(...nums);
      if(row.low===false && nums.length) best=Math.max(...nums);
      return '<tr><th>'+esc(row.n)+'</th>'+row.v.map(x=>
        '<td'+(best!==null && x===best ? ' class="best"':'')+'>'+row.fmt(x)+'</td>').join('')+'</tr>';
    }).join('')+
   '</tbody></table></div>'+
   '<div class="tiny muted" style="margin-top:8px">초록색이 그 줄에서 가장 나은 값입니다. '+
   '값이 싸다고 늘 이기는 것은 아니라 납기·MOQ·평가를 함께 봅니다.</div>';
}

function editPo(id){
  if(!D.suppliers.length){ toast('외주업체를 먼저 등록해 주세요'); return; }
  const o = id ? cur.pos.find(x=>x.id===id) : null;
  const m = o ? (cur.pmoney[o.id]||{}) : {};
  const p = prjOf(cur.id);
  const win = cur.rfqs.find(r=>r.status==='won');
  const wm  = win ? (cur.rmoney[win.id]||{}) : {};
  const fin = cur.specs.find(s=>s.is_final)||cur.specs[0];
  /* 확정된 견적이 있으면 그 값을 미리 채워 둡니다 — 옮겨 적다가 틀리는 자리입니다. */
  const row = o ? {...o, unit_price:m.unit_price}
    : {supplier_id:win?win.supplier_id:'', ordered_on:today(), qty:win?win.qty:p.qty_plan,
       unit_price:wm.unit_price, due_on:p.due_on, pay_term:win?win.pay_term:'',
       spec_ver:fin?fin.ver:'', status:'draft'};
  const F=poFields();
  openSheet(o?'발주서':'외주 발주서', formHtml(F,row)+
    '<div class="fsec">합계</div><div id="poSum" class="small muted"></div>',
    (o?'<button class="btn line sm" style="flex:0 0 auto;width:auto" onclick="poShare(\''+o.id+'\')">업체 링크</button>':'')+
    saveFoot('저장'));
  const recalc=()=>{
    const qty=Number(digits(($('f_qty')||{}).value||''))||0;
    const upEl=$('f_unit_price'); const up=upEl?Number(digits(upEl.value))||0:0;
    const supply=qty*up, vat=Math.round(supply*0.1);
    const el=$('poSum');
    if(el) el.innerHTML = canEditMoney()
      ? '공급가 <b class="mono">'+won(supply)+'</b> · 부가세 <b class="mono">'+won(vat)+
        '</b> · 합계 <b class="mono" style="color:var(--ink)">'+won(supply+vat)+'원</b>'
      : '금액은 관리자만 넣습니다.';
    return {supply,vat,total:supply+vat,unit:up};
  };
  ['f_qty','f_unit_price'].forEach(k=>{ const el=$(k); if(el) el.oninput=recalc; });
  recalc();
  $('sheetGo').onclick=async()=>{
    const v=readForm(F); if(!v) return;
    const sum=recalc();
    const body={supplier_id:v.supplier_id, no:v.no||nextPono(), ordered_on:v.ordered_on, due_on:v.due_on,
      qty:v.qty, place:v.place, pay_term:v.pay_term, status:v.status, req_note:v.req_note,
      spec_ver:v.spec_ver||null, sup_due_on:v.sup_due_on, sup_note:v.sup_note,
      sample_done_on:v.sample_done_on, make_done_on:v.make_done_on,
      project_id:cur.id, rfq_id:(cur.rfqs.find(r=>r.status==='won')||{}).id||null};
    if(!o) body.created_by=me.id;
    const saved=await saveRow('os_pos', o?o.id:null, body);
    if(!saved) return;
    if(canEditMoney()){
      await sb.from('os_po_money').upsert({po_id:saved.id, company_id:me.companyId,
        unit_price:sum.unit, supply:sum.supply, vat:sum.vat, total:sum.total},{onConflict:'po_id'});
      cur.pmoney[saved.id]={po_id:saved.id, unit_price:sum.unit, supply:sum.supply, vat:sum.vat, total:sum.total};
      await syncPoCost(saved, sum.supply);
    }
    const sName=(supOf(v.supplier_id)||{}).name||'';
    if(o){ Object.assign(o,saved); logAct(cur.id,'po',sName+' 발주서를 고쳤습니다 ('+PO_STAT[saved.status].n+')'); }
    else { cur.pos.push(saved); logAct(cur.id,'po',sName+' 에 발주했습니다 — '+saved.no); }
    if(saved.status!=='draft') await bump(cur.id,'ordered');
    if(saved.make_done_on) await bump(cur.id,'qc');
    closeSheet(); toast('저장했습니다'); drawDetail();
  };
}
function nextPono(){
  const y=today().slice(0,4);
  return 'PO-'+y+'-'+String((cur.pos.length||0)+1).padStart(3,'0')+'-'+String(cur.id).slice(0,4);

/* 발주 금액을 원가에 반영합니다. 이미 이 발주서에서 온 줄이 있으면
   고치고, 없으면 만듭니다 — 발주서를 손볼 때마다 원가 줄이 쌓이면 안 됩니다. */
async function syncPoCost(po, supply){
  const exist=cur.costs.find(c=>c.po_id===po.id);
  const sName=(supOf(po.supplier_id)||{}).name||'외주';
  const body={project_id:cur.id, po_id:po.id, supplier_id:po.supplier_id, category:'outsource',
              title:sName+' 외주 제작비', qty:po.qty, unit_price:supply&&po.qty?supply/po.qty:null,
              fix_amount:supply, memo:'발주서 '+(po.no||'')+' 에서 저절로 들어왔습니다'};
  if(exist){ const s=await saveRow('os_cost_items', exist.id, body); if(s) Object.assign(exist,s); }
  else{ const s=await saveRow('os_cost_items', null, {...body, est_amount:supply});
        if(s){ cur.costs.push(s); D.costs.push(s); } }
}

/* ═══════════════════════════════════════════════════════════════
   보관함 — 경로가 곧 권한입니다
   {회사id}/{프로젝트id}/{uuid}.확장자
   사람이 보는 이름은 데이터베이스에 따로 담습니다. 같은 이름을 여러 번
   올려도 서로 덮어쓰지 않게 하려는 것입니다.
   ═══════════════════════════════════════════════════════════════ */
async function upload(file, pid){
  const ext=(file.name.match(/\.([A-Za-z0-9]{1,8})$/)||[,'bin'])[1].toLowerCase();
  const path = me.companyId+'/'+pid+'/'+uid()+'.'+ext;
  const {error}=await sb.storage.from(BUCKET).upload(path, file, {upsert:false, contentType:file.type||undefined});
  if(error){ toast('올리지 못했습니다: '+String(error.message).slice(0,50)); return null; }
  return path;
}
const signCache={};
async function signed(path){
  if(!path) return '';
  if(signCache[path] && signCache[path].t > Date.now()) return signCache[path].u;
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  if(error||!data) return '';
  signCache[path]={u:data.signedUrl, t:Date.now()+50*60*1000};
  return data.signedUrl;
}
/* 화면에 붙인 뒤 주소를 하나씩 채웁니다. 미리 다 받아 두면 사진이 스무 장일 때
   화면이 그때까지 안 뜹니다. */
async function fillShots(root){
  for(const el of $$('[data-path]', root||document)){
    const u=await signed(el.dataset.path);
    if(u){ if(el.tagName==='IMG') el.src=u; else el.href=u; }
  }
}

async function sampleTo(id, st){

  if(error){ toast('바꾸지 못했습니다'); return; }

  if(st==='review')   await bump(cur.id,'review');

/* 샘플 사진 — 제작업무에서 사진이 말보다 빠릅니다(지시서 56장) */
function addShot(sid){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='image/*'; inp.multiple=true;
  inp.onchange=async()=>{
    const s=cur.samples.find(x=>x.id===sid); if(!s) return;
    toast('올리는 중입니다…');
    const add=[];
    for(const f of Array.from(inp.files).slice(0,10)){
      const p=await upload(f, cur.id);
      if(p) add.push({p, n:f.name, at:new Date().toISOString()});
    }
    if(!add.length) return;
    const photos=(s.photos||[]).concat(add);
    const {error}=await sb.from('os_samples').update({photos}).eq('id',sid);
    if(error){ toast('저장하지 못했습니다'); return; }
    s.photos=photos;
    logAct(cur.id,'sample',skindN(s.kind)+' 사진 '+add.length+'장을 올렸습니다');
    toast(add.length+'장 올렸습니다'); drawDetail();
  };
  inp.click();
}

let fileFolder='';
function tabFile(){
  const list = fileFolder ? cur.files.filter(f=>f.folder===fileFolder) : cur.files;

  const groups={};

  return '<div class="drop" id="drop" style="margin-bottom:12px">'+
      '<b>파일을 여기에 끌어다 놓으세요</b><br>'+

        return n?'<button class="chip'+(fileFolder===f.k?' on':'')+'" onclick="fileFolder=\''+f.k+'\';drawDTab()">'+
          esc(f.n)+' '+n+'</button>':''; }).join('')+
    '</div>'+
    (Object.keys(groups).length ?
      Object.keys(groups).map(nm=>{
        const g=groups[nm], top=g[0];
        return '<div class="card" style="padding:13px 15px">'+
          '<div class="spread"><div class="grow" style="min-width:0">'+
            '<b class="trunc" style="display:block">'+esc(nm)+'</b>'+
            '<span class="tiny muted">'+esc(folderN(top.folder))+' · V'+top.ver+
              ' · '+esc(nameOf(top.uploaded_by)||'—')+' · '+ago(top.created_at)+
              (top.size?' · '+kb(top.size):'')+'</span></div>'+
            (top.is_final?'<span class="tag green">FINAL</span>':'')+
          '</div>'+
          (top.note?'<div class="tiny muted" style="margin-top:6px">'+esc(top.note)+'</div>':'')+
          '<div class="row wrap" style="gap:6px;margin-top:9px">'+
            '<a class="chip sm" data-path="'+esc(top.path)+'" target="_blank" rel="noopener" href="#">열기</a>'+
            (top.is_final?'':'<button class="chip sm" onclick="markFinal(\''+top.id+'\')">최종본으로</button>')+
            '<button class="chip sm" onclick="editFile(\''+top.id+'\')">정보</button>'+
            (g.length>1?'<button class="chip sm" onclick="showVers(\''+esc(nm).replace(/'/g,"\\'")+'\')">이전 판 '+(g.length-1)+'개</button>':'')+
          '</div></div>';

      : '<div class="card"><div class="empty"><b>올린 파일이 없습니다</b>'+

}
const kb = n => n>1048576 ? (n/1048576).toFixed(1)+'MB' : Math.max(1,Math.round(n/1024))+'KB';
function wireDrop(){
  const d=$('drop'); if(!d) return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',ev=>{ const fs=Array.from(ev.dataTransfer.files||[]); if(fs.length) askUpload(fs); });
  setTimeout(()=>fillShots($('dBody')),0);
}
function pickFile(){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true;
  inp.onchange=()=>{ const fs=Array.from(inp.files||[]); if(fs.length) askUpload(fs); };
  inp.click();
}
/* 올리기 전에 어느 서랍인지 묻습니다. 나중에 정리하려면 아무도 안 합니다. */
function askUpload(files){
  const F=[
    {k:'folder',l:'어느 서랍에',t:'sel',req:true,opts:FOLDERS},
    {k:'note',l:'설명',t:'text',ph:'무엇인지 한 줄'},
  ];
  openSheet('파일 '+files.length+'개 올리기',
    '<div class="small muted" style="margin-bottom:12px">'+
      files.map(f=>esc(f.name)+' <span class="tiny">('+kb(f.size)+')</span>').join('<br>')+'</div>'+
    formHtml(F,{folder:guessFolder(files[0].name)}), saveFoot('올리기'));
  $('sheetGo').onclick=async()=>{
    const v=readForm(F); if(!v) return;
    const btn=$('sheetGo'); btn.disabled=true; btn.textContent='올리는 중…';
    let n=0;
    for(const f of files){
      const path=await upload(f, cur.id); if(!path) continue;
      const prev=cur.files.filter(x=>x.name===f.name);
      const ver=prev.length ? Math.max(...prev.map(x=>x.ver))+1 : 1;
      const saved=await saveRow('os_files', null, {project_id:cur.id, folder:v.folder, name:f.name,
        path, ver, size:f.size, mime:f.type||'', note:v.note||'', uploaded_by:me.id,
        kind:kindOfFolder(v.folder)});
      if(saved){ cur.files.unshift(saved); n++; }
    }
    btn.disabled=false;
    logAct(cur.id,'file','파일 '+n+'개를 올렸습니다 ('+folderN(v.folder)+')');
    closeSheet(); toast(n+'개 올렸습니다'); drawDetail();
  };
}
function guessFolder(name){
  const n=String(name).toLowerCase();
  if(/\.(ai|psd|indd|pdf|eps|svg)$/.test(n)) return '02_DESIGN';
  if(/견적|quote/.test(n)) return '03_QUOTATION';
  if(/발주|po|order/.test(n)) return '06_PRODUCTION';
  if(/사양|spec/.test(n)) return '01_SPEC';
  if(/샘플|sample/.test(n)) return '04_SAMPLE';
  return '09_DOCUMENT';
}
const kindOfFolder = f => ({'01_SPEC':'spec','02_DESIGN':'design','03_QUOTATION':'quote',
  '04_SAMPLE':'sample','05_APPROVAL':'etc','06_PRODUCTION':'po','07_QC':'qc','08_DELIVERY':'etc'}[f]||'etc');

async function markFinal(id){
  const f=cur.files.find(x=>x.id===id); if(!f) return;
  /* 같은 이름의 다른 판에서 최종 표시를 뗍니다 — 최종본이 둘이면 최종이 아닙니다. */
  const same=cur.files.filter(x=>x.name===f.name && x.is_final);
  for(const s of same){ await sb.from('os_files').update({is_final:false}).eq('id',s.id); s.is_final=false; }
  const {error}=await sb.from('os_files').update({is_final:true}).eq('id',id);
  if(error){ toast('바꾸지 못했습니다'); return; }
  f.is_final=true;
  logAct(cur.id,'file',f.name+' V'+f.ver+' 을(를) 최종본으로 정했습니다');
  toast('최종본으로 정했습니다'); drawDetail();
}
function editFile(id){
  const f=cur.files.find(x=>x.id===id); if(!f) return;
  const F=[{k:'folder',l:'서랍',t:'sel',opts:FOLDERS},{k:'note',l:'설명',t:'area'}];
  openSheet(f.name, formHtml(F,f),
    (isAdmin()?'<button class="btn danger sm" style="flex:0 0 auto;width:auto" onclick="delFile(\''+f.id+'\')">지우기</button>':'')+
    saveFoot('저장'));
  $('sheetGo').onclick=async()=>{
    const v=readForm(F); if(!v) return;
    const saved=await saveRow('os_files', f.id, v);
    if(!saved) return;
    Object.assign(f,saved); closeSheet(); toast('저장했습니다'); drawDetail();
  };
}
async function delFile(id){
  if(await softDelete('os_files',id,'파일을')){
    cur.files=cur.files.filter(x=>x.id!==id); closeSheet(); drawDetail();
  }
}
function showVers(name){
  const g=cur.files.filter(f=>f.name===name).sort((a,b)=>b.ver-a.ver);
  openSheet(name,
    g.map(f=>'<div class="li"><span class="ic">V'+f.ver+'</span>'+
      '<span class="lb"><b>V'+f.ver+(f.is_final?' · 최종본':'')+'</b>'+
      '<span>'+esc(nameOf(f.uploaded_by)||'—')+' · '+dfull(f.created_at)+
        (f.size?' · '+kb(f.size):'')+'</span></span>'+
      '<a class="chip sm" data-path="'+esc(f.path)+'" target="_blank" rel="noopener" href="#">열기</a></div>').join(''),
    '<button class="btn ghost" onclick="closeSheet()">닫기</button>');
  fillShots($('sheetBody'));
}

      '<div class="f"><textarea id="cmt" placeholder="@ 로 팀원을 부를 수 있습니다"></textarea></div>'+

    '</div>'+
    '<div class="card"><h3>모든 기록 '+cur.acts.length+'건</h3>'+
      (cur.acts.length ? '<div style="margin-top:8px">'+cur.acts.map(a=>
        '<div class="feed"><span class="av">'+esc(ACT_ICON[a.kind]||'·')+'</span>'+
        '<span class="fb"><b>'+esc(a.by_name||'—')+'</b> '+esc(a.body)+'</span>'+
        '<span class="ft">'+esc(ago(a.at))+'</span></div>').join('')+'</div>'
        : '<div class="empty">아직 기록이 없습니다</div>')+
    '</div>';

async function addComment(){
  const t=$('cmt').value.trim(); if(!t) return;
  /* @이름 을 찾아 그 사람 id 를 함께 담습니다. 알림은 그 목록을 보고 만듭니다. */
  const men=[];
  D.members.forEach(m=>{ const n=m.name||m.login_id;
    if(n && t.includes('@'+n)) men.push(m.id); });
  const {data,error}=await sb.from('os_activity').insert({company_id:me.companyId, project_id:cur.id,
    kind:'comment', body:t, mentions:men, by_id:me.id, by_name:me.name}).select().single();
  if(error){ toast('남기지 못했습니다'); return; }
  cur.acts.unshift(data); D.acts.unshift(data);
  $('cmt').value=''; toast(men.length?men.length+'명을 불렀습니다':'남겼습니다'); drawDTab();
}

function editTask(id, pid){
  const t = id ? (D.tasks.find(x=>x.id===id) || (cur&&cur.tasks.find(x=>x.id===id))) : null;
  const F=[
    {k:'title',l:'할 일',t:'text',req:true,ph:'예) A업체에 견적 다시 확인'},
    {k:'project_id',l:'프로젝트',t:'sel',
      opts:[{k:'',n:'— 없음 —'}].concat(D.projects.filter(p=>!['done','canceled'].includes(p.status))
        .map(p=>({k:p.id,n:p.name})))},
    {k:'assignee_id',l:'담당',t:'sel',w:1,
      opts:[{k:'',n:'— 없음 —'}].concat(D.members.map(m=>({k:m.id,n:m.name||m.login_id})))},
    {k:'due_on',l:'마감',t:'date',w:1},
    {k:'priority',l:'우선순위',t:'sel',w:1,opts:Object.entries(PRIO).map(([k,v])=>({k,n:v.n}))},
    {k:'supplier_id',l:'관련 업체',t:'sel',w:1,opts:supOpts()},
    {k:'memo',l:'메모',t:'area'},
  ];
  const row = t || {project_id:pid||(cur?cur.id:''), assignee_id:me.id, priority:'normal', due_on:today()};
  openSheet(t?'할 일':'할 일 추가', formHtml(F,row),
    (t?'<button class="btn danger sm" style="flex:0 0 auto;width:auto" onclick="delTask(\''+t.id+'\')">지우기</button>':'')+
    saveFoot('저장'));
  $('sheetGo').onclick=async()=>{
    const v=readForm(F); if(!v) return;
    const body={...v, project_id:v.project_id||null, assignee_id:v.assignee_id||null,
                supplier_id:v.supplier_id||null};
    if(!t) body.created_by=me.id;
    const saved=await saveRow('os_tasks', t?t.id:null, body);
    if(!saved) return;
    if(t){ Object.assign(t,saved);
           const g=D.tasks.find(x=>x.id===t.id); if(g) Object.assign(g,saved); }
    else { D.tasks.push(saved); if(cur && saved.project_id===cur.id) cur.tasks.push(saved); }
    if(saved.project_id) logAct(saved.project_id,'task',(t?'할 일을 고쳤습니다 — ':'할 일을 만들었습니다 — ')+saved.title);
    closeSheet(); toast('저장했습니다'); redraw();
  };
}
async function delTask(id){
  if(await softDelete('os_tasks',id,'할 일을')){
    D.tasks=D.tasks.filter(x=>x.id!==id);
    if(cur) cur.tasks=cur.tasks.filter(x=>x.id!==id);
    closeSheet(); redraw();
  }
}
function redraw(){
  if(!$('detail').hidden && cur) drawDetail();
  else if(!$('app').hidden) PAGES[page]();
}

/* ═══════════════════════════════════════════════════════════════
   거래처 — 고객사와 외주업체
   둘을 한 쪽에 둔 이유: 제작기획사에서 이 둘은 같은 무게입니다.
   한쪽에서 받아 다른 쪽에 맡기는 것이 일의 전부이기 때문입니다.
   ═══════════════════════════════════════════════════════════════ */
let bizTab='cust', bizQ='';
function drawBiz(){
  const q=bizQ.toLowerCase();
  const cs=D.customers.filter(c=>!q||[c.name,c.biz_name,c.phone,c.memo].join(' ').toLowerCase().includes(q));
  const ss=D.suppliers.filter(s=>!q||[s.name,s.contact_name,s.phone,(s.caps||[]).join(' ')].join(' ').toLowerCase().includes(q));
  const list = bizTab==='cust' ? cs : ss;

  $('p-biz').innerHTML =
    '<div class="ptitle">거래처</div>'+
    '<p class="psub">고객사 '+D.customers.length+' · 외주업체 '+D.suppliers.length+'</p>'+
    '<div class="chips" style="margin-bottom:11px">'+
      '<button class="chip'+(bizTab==='cust'?' on':'')+'" onclick="bizTab=\'cust\';drawBiz()">고객사</button>'+
      '<button class="chip'+(bizTab==='sup'?' on':'')+'" onclick="bizTab=\'sup\';drawBiz()">외주업체</button>'+
    '</div>'+
    '<div class="search">'+
      '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+
      '<input id="bizQ" placeholder="'+(bizTab==='cust'?'고객사 이름·전화':'업체 이름·공정')+'로 찾기" value="'+esc(bizQ)+'">'+
    '</div>'+
    '<div class="card">'+
      (list.length ? list.map(bizTab==='cust'?custRow:supRow).join('')
        : '<div class="empty"><b>'+(bizQ?'찾는 것이 없습니다':'아직 없습니다')+'</b>'+
          (bizTab==='cust'?'발주를 주는 회사를 등록합니다':'만들어 주는 곳을 등록합니다')+'</div>')+
    '</div>'+
    '<button class="btn" onclick="'+(bizTab==='cust'?'editCust(null)':'editSup(null)')+'">'+
      (bizTab==='cust'?'고객사 추가':'외주업체 추가')+'</button>';
  const el=$('bizQ');
  if(el) el.oninput=e=>{ bizQ=e.target.value; clearTimeout(el._t);
    el._t=setTimeout(()=>{ const p=el.selectionStart; drawBiz();
      const n=$('bizQ'); if(n){n.focus();n.setSelectionRange(p,p);} },250); };
}
function custRow(c){
  const ps=D.projects.filter(p=>p.customer_id===c.id);
  const live=ps.filter(p=>!['done','canceled'].includes(p.status)).length;
  let money='';
  if(canMoney()){
    const sum=ps.reduce((a,p)=>a+((D.money[p.id]||{}).sales_amount?Number(D.money[p.id].sales_amount):0),0);
    if(sum) money='<b>'+won(sum)+'</b>';
  }
  return '<button class="li" onclick="openCust(\''+c.id+'\')">'+
    '<span class="ic">'+esc(c.name.slice(0,2))+'</span>'+
    '<span class="lb"><b>'+esc(c.name)+'</b><span>'+
      (live?'진행 '+live+'건':ps.length?'완료 '+ps.length+'건':'프로젝트 없음')+
      (c.phone?' · '+esc(c.phone):'')+'</span></span>'+
    '<span class="rt">'+money+'</span>'+
    '<span class="arw"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span></button>';
}
function supRow(s){
  const sc=supScore(s.id);
  const pos=D.projects.length; /* 발주 건수는 프로젝트를 열어야 알 수 있어 목록에서는 생략합니다 */
  return '<button class="li" onclick="openSup(\''+s.id+'\')">'+
    '<span class="ic">'+esc(s.name.slice(0,2))+'</span>'+
    '<span class="lb"><b>'+esc(s.name)+'</b><span>'+
      ((s.caps||[]).slice(0,4).join(' · ')||'가능 공정 미입력')+'</span></span>'+
    '<span class="rt">'+(sc!==null?'<b>'+sc+'점</b>':'')+
      (s.lead_days?'<span>'+s.lead_days+'일</span>':'')+'</span>'+
    '<span class="arw"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span></button>';
}

function editCust(id){
  const c = id ? custOf(id) : null;
  const F=custFields();
  openSheet(c?'고객사 고치기':'고객사 추가', formHtml(F,c||{status:'active'}), saveFoot('저장'));
  $('sheetGo').onclick=async()=>{
    const v=readForm(F); if(!v) return;
    if(v.biz_no) v.biz_no=digits(v.biz_no);        /* 하이픈을 같이 담으면 같은 회사가 두 값이 됩니다 */
    const body={...v, owner_id:c?c.owner_id:me.id};

    closeSheet(); toast('저장했습니다'); drawBiz();

  const live=ps.filter(p=>!['done','canceled'].includes(p.status));

    ps.forEach(p=>{ const pl=plOf(p.id); if(pl){ sales+=pl.sales; profit+=pl.profit; } });

      '<dt>총 매출</dt><dd class="mono">'+won(sales)+'원</dd>'+

      (c.biz_ceo?'<dt>대표자</dt><dd>'+esc(c.biz_ceo)+'</dd>':'')+

      (c.addr?'<dt>주소</dt><dd>'+esc(c.addr)+'</dd>':'')+
      (c.pay_term?'<dt>결제조건</dt><dd>'+esc(c.pay_term)+'</dd>':'')+
      (c.memo?'<dt>메모</dt><dd style="white-space:pre-wrap">'+esc(c.memo)+'</dd>':'')+

    (ps.length ? ps.slice(0,12).map(p=>

    '<button class="btn ghost" onclick="closeSheet();editCust(\''+c.id+'\')">고치기</button>'+

   일정 — 달력
   납기·샘플 예정·발주 납기가 한 판에 보여야 "이번 주에 뭐가 몰렸나" 를 압니다.
   ═══════════════════════════════════════════════════════════════ */
let calYM = today().slice(0,7);
function calEvents(){
  const ev=[];
  D.projects.forEach(p=>{
    if(['canceled'].includes(p.status)) return;
    if(p.due_on) ev.push({d:p.due_on, c:'red', t:'납기 · '+p.name, id:p.id});
    if(p.started_on && stIdx(p.status)<2) ev.push({d:p.started_on, c:'gray', t:'시작 · '+p.name, id:p.id});
  });
  D.tasks.filter(t=>!t.done&&t.due_on).forEach(t=>{
    ev.push({d:t.due_on, c:'amber', t:'할 일 · '+t.title, id:t.project_id});
  });
  return ev;
}
function drawCal(){
  const [y,m]=calYM.split('-').map(Number);
  const first=new Date(Date.UTC(y,m-1,1)), start=first.getUTCDay();
  const days=new Date(Date.UTC(y,m,0)).getUTCDate();
  const ev=calEvents().filter(e=>String(e.d).slice(0,7)===calYM);
  const byDay={}; ev.forEach(e=>{ const d=Number(String(e.d).slice(8,10)); (byDay[d]=byDay[d]||[]).push(e); });

  let cells='';
  for(let i=0;i<start;i++) cells+='<div></div>';
  for(let d=1;d<=days;d++){
    const list=byDay[d]||[];
    const isToday = calYM+'-'+String(d).padStart(2,'0')===today();
    cells+='<div style="min-height:64px;border-radius:9px;padding:5px 5px 4px;'+
      (isToday?'background:var(--blue-bg);':'background:var(--fill2);')+'">'+
      '<div class="tiny" style="font-weight:800;color:'+(isToday?'var(--blue-d)':'var(--mut)')+'">'+d+'</div>'+
      list.slice(0,3).map(e=>'<div class="tiny trunc" style="margin-top:2px;cursor:pointer" '+
        (e.id?'onclick="openPrj(\''+e.id+'\')"':'')+'>'+
        '<span class="dot '+e.c+'" style="display:inline-block;vertical-align:middle;margin-right:3px"></span>'+
        esc(e.t)+'</div>').join('')+
      (list.length>3?'<div class="tiny muted">+'+(list.length-3)+'</div>':'')+
    '</div>';
  }
  const upcoming=calEvents().filter(e=>{ const g=dayGap(e.d); return g!==null&&g>=0&&g<=14; })
    .sort((a,b)=>String(a.d).localeCompare(String(b.d)));

  $('p-cal').innerHTML =
    '<div class="spread"><div class="ptitle">'+y+'년 '+m+'월</div>'+
      '<div class="row" style="gap:6px">'+
        '<button class="chip" onclick="shiftM(-1)">‹</button>'+
        '<button class="chip" onclick="calYM=today().slice(0,7);drawCal()">오늘</button>'+
        '<button class="chip" onclick="shiftM(1)">›</button></div></div>'+
    '<p class="psub">이 달 일정 '+ev.length+'건</p>'+
    '<div class="card">'+
      '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px">'+
      ['일','월','화','수','목','금','토'].map((w,i)=>'<div class="tiny" style="text-align:center;font-weight:800;color:'+
        (i===0?'var(--red)':i===6?'var(--blue)':'var(--mut)')+'">'+w+'</div>').join('')+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px">'+cells+'</div>'+
    '</div>'+
    '<div class="card"><h3>앞으로 2주</h3>'+
      (upcoming.length ? upcoming.map(e=>
        '<div class="urg"'+(e.id?' onclick="openPrj(\''+e.id+'\')" style="cursor:pointer"':'')+'>'+
        '<i class="dot '+e.c+'"></i><span class="grow"><b>'+esc(e.t)+'</b>'+
        '<span>'+dfull(e.d)+' · '+dueText(e.d)+'</span></span></div>').join('')
        : '<div class="empty">2주 안에 잡힌 것이 없습니다</div>')+
    '</div>';
}
function shiftM(n){
  const [y,m]=calYM.split('-').map(Number);
  const d=new Date(Date.UTC(y,m-1+n,1));
  calYM=d.toISOString().slice(0,7); drawCal();
}

/* ═══════════════════════════════════════════════════════════════
   알림
   따로 표를 두지 않았습니다. 알릴 거리가 이미 자료 안에 다 있어서,
   볼 때마다 셈합니다 — 표를 두면 "만들어 넣는 것" 을 빠뜨리는 자리가
   또 하나 생기고, 안 온 알림은 아무도 눈치채지 못합니다.
   ═══════════════════════════════════════════════════════════════ */
function notis(){
  const out=[];
  const live=liveP();
  live.forEach(p=>{
    const g=dayGap(p.due_on);
    if(g!==null){
      if(g<0)      out.push({c:'red',   t:'납기 지남',   b:p.name+' · '+Math.abs(g)+'일', id:p.id, o:g});
      else if(g<=1) out.push({c:'red',  t:'납기 '+(g?'D-1':'오늘'), b:p.name, id:p.id, o:10+g});
      else if(g<=3) out.push({c:'amber',t:'납기 D-'+g,   b:p.name, id:p.id, o:20+g});
      else if(g<=7) out.push({c:'amber',t:'납기 D-'+g,   b:p.name, id:p.id, o:30+g});
      else if(g<=14)out.push({c:'blue', t:'납기 D-'+g,   b:p.name, id:p.id, o:40+g});
    }
    if(p.status==='review') out.push({c:'amber',t:'고객 승인 대기',b:p.name,id:p.id,o:60});
    if(p.status==='rfq')    out.push({c:'blue', t:'외주 견적 회신 대기',b:p.name,id:p.id,o:70});
  });
  D.tasks.filter(t=>!t.done&&t.due_on&&dayGap(t.due_on)<=0)
    .filter(t=>!t.assignee_id||t.assignee_id===me.id)
    .forEach(t=>out.push({c:'red',t:'할 일 마감',b:t.title,id:t.project_id,o:5}));
  /* 나를 부른 댓글 */
  D.acts.filter(a=>a.kind==='comment'&&(a.mentions||[]).includes(me.id))
    .slice(0,10).forEach(a=>out.push({c:'violet',t:'나를 불렀습니다',
      b:(a.by_name||'')+' · '+String(a.body).slice(0,40), id:a.project_id, o:1}));
  return out.sort((a,b)=>a.o-b.o);
}
function openNoti(){
  const list=notis();
  $('notiPane').hidden=false; document.body.style.overflow='hidden';
  $('notiPane').innerHTML='<div class="dbar"><div class="in">'+
      '<button class="iconbtn" onclick="closeNoti()"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'+

/* ═══════════════════════════════════════════════════════════════
   프로젝트 복제 (지시서 43장)
   반복 제작이 많습니다. 무엇을 가져올지 고르게 합니다 —
   통째로 베끼면 지난번 샘플·발주가 딸려 와 새 프로젝트가 이미
   진행 중인 것처럼 보입니다.
   ═══════════════════════════════════════════════════════════════ */
function dupPrj(){
  const p=prjOf(cur.id);
  openSheet('프로젝트 복제',
    '<div class="small muted" style="margin-bottom:12px"><b>'+esc(p.name)+'</b> 를 바탕으로 새로 만듭니다.</div>'+
    '<div class="f"><label>새 프로젝트명</label><input id="dupName" value="'+esc(p.name+' (복제)')+'"></div>'+
    '<div class="f"><label>목표 납기</label><input id="dupDue" type="date" value=""></div>'+
    '<div class="fsec">무엇을 가져올까요</div>'+
    ['spec:사양 (최신 판 하나)','sup:외주업체 (견적 요청만, 금액 없이)','cost:원가 항목 (예상 금액만)',
     'task:할 일'].map(x=>{ const [k,n]=x.split(':');
      return '<label class="pickrow" style="cursor:pointer"><input type="checkbox" id="dup_'+k+'" checked '+
        'style="width:20px;height:20px;accent-color:var(--blue)"><span class="pb"><b>'+n+'</b></span></label>';
     }).join(''),
    saveFoot('복제하기'));
  $('sheetGo').onclick=async()=>{
    const name=$('dupName').value.trim(); if(!name){ toast('이름을 적어 주세요'); return; }
    const btn=$('sheetGo'); btn.disabled=true; btn.textContent='만드는 중…';
    const np=await saveRow('os_projects', null, {
      name, customer_id:p.customer_id, category:p.category, owner_id:me.id,
      code:nextCode(), priority:p.priority, contact_name:p.contact_name,
      started_on:today(), due_on:$('dupDue').value||null, qty_plan:p.qty_plan,
      tags:p.tags, memo:p.memo});
    if(!np){ btn.disabled=false; return; }
    if($('dup_spec').checked && cur.specs.length){
      const s={...(cur.specs.find(x=>x.is_final)||cur.specs[0])};
      ['id','company_id','project_id','ver','is_final','created_at','updated_at','deleted'].forEach(k=>delete s[k]);
      await saveRow('os_specs', null, {...s, project_id:np.id, ver:1, created_by:me.id,
        note:'「'+p.name+'」에서 가져왔습니다'});
    }
    if($('dup_sup').checked){
      for(const r of cur.rfqs){
        await saveRow('os_rfqs', null, {project_id:np.id, supplier_id:r.supplier_id,
          qty:np.qty_plan, status:'draft', req_note:r.req_note, created_by:me.id});
      }
    }
    if($('dup_cost').checked && canEditMoney()){
      for(const c of cur.costs){
        await saveRow('os_cost_items', null, {project_id:np.id, category:c.category,
          title:c.title, supplier_id:c.supplier_id, qty:c.qty, unit_price:c.unit_price,
          est_amount: bestAmt(c), memo:'「'+p.name+'」의 실제 원가를 예상으로 옮겼습니다'});
      }
    }
    if($('dup_task').checked){
      for(const t of cur.tasks.filter(x=>!x.done)){
        await saveRow('os_tasks', null, {project_id:np.id, title:t.title,
          assignee_id:t.assignee_id, priority:t.priority, created_by:me.id});
      }
    }
    D.projects.unshift(np);
    logAct(np.id,'note','「'+p.name+'」에서 복제해 만들었습니다');
    closeSheet(); closeDetail(); toast('복제했습니다'); await pull(); openPrj(np.id);
  };
}

/* ═══════════════════════════════════════════════════════════════
   바깥에서 들어온 사람 — 고객사와 외주업체
   같은 링크 칸(?t=)으로 들어오고, 무슨 토큰인지는 서버가 가릅니다.
   여기서는 로그인하지 않습니다. 문지기(reos-gate)가 대신 읽고 씁니다.
   ═══════════════════════════════════════════════════════════════ */
let portalT=null, portalPin='';
async function gate(payload){
  try{
    const r=await fetch(FN_BASE+'/reos-gate',{
      method:'POST', headers:{'Content-Type':'application/json','apikey':SB_KEY},
      body:JSON.stringify(payload)});
    const j=await r.json().catch(()=>({error:'응답을 읽지 못했습니다'}));
    return {status:r.status, ...j};
  }catch(e){ return {status:0, error:'연결하지 못했습니다. 잠시 뒤 다시 열어 주세요.'}; }
}
async function openPortal(t){
  portalT=t;
  $('gate').hidden=true; $('app').hidden=true; $('pub').hidden=false;
  $('pub').innerHTML='<div class="in"><div class="skel" style="height:40px"></div><div class="skel"></div></div>';
  const r=await gate({t, action:'view'});
  if(r.needPin){ drawPin(''); return; }
  if(r.error){ drawPubErr(r.error); return; }
  if(r.kind==='customer') drawCustomerView(r);
  else drawSupplierView(r);
}
function drawPubErr(msg){
  $('pub').innerHTML='<div id="pinPane"><i class="logo"></i>'+
    '<h2>열 수 없습니다</h2><p>'+esc(msg)+'</p>'+
    '<p class="tiny">링크를 보내 준 담당자에게 문의해 주세요.</p></div>';
}
function drawPin(msg){
  $('pub').innerHTML='<div id="pinPane"><i class="logo"></i>'+
    '<h2>발주 확인</h2><p>담당자에게 받은 <b>핀</b>을 넣어 주세요.<br>'+
    '링크만으로는 열리지 않습니다.</p>'+
    '<input id="pinIn" inputmode="numeric" maxlength="8" placeholder="••••••" autocomplete="off">'+
    '<div class="msg">'+esc(msg||'')+'</div>'+
    '<button class="btn" id="pinGo" style="margin-top:8px">들어가기</button></div>';
  const go=async()=>{
    const v=($('pinIn').value||'').replace(/[^0-9]/g,'');
    if(v.length<4){ $('pub').querySelector('.msg').textContent='핀을 넣어 주세요.'; return; }
    const b=$('pinGo'); b.disabled=true; b.textContent='확인 중…';
    const r=await gate({t:portalT, pin:v, action:'view'});
    b.disabled=false; b.textContent='들어가기';
    if(r.error){ drawPin(r.error); return; }
    portalPin=v;
    if(r.kind==='supplier') drawSupplierView(r); else drawCustomerView(r);
  };
  $('pinGo').onclick=go;
  $('pinIn').onkeydown=e=>{ if(e.key==='Enter') go(); };
  setTimeout(()=>$('pinIn').focus(),80);
}

        (o.status==='sent'?'<button class="btn ghost sm" onclick="supSend({accept:true})">발주 접수</button>':'')+
        (['sent','accepted'].includes(o.status)?'<button class="btn ghost sm" onclick="supSend({making:true})">생산 시작</button>':'')+
        '<button class="btn" style="flex:1;min-width:140px" onclick="supSend({})">저장</button>'+
      '</div>'+
      '<div class="msg tiny" id="supMsg" style="margin-top:10px;color:var(--green);font-weight:700"></div>'+
    '</div>'+
    '<div class="tiny muted" style="text-align:center;padding:8px 0 34px;line-height:1.7">'+
      '이 링크는 이 발주 건만 보여 줍니다.<br>핀은 다른 분과 나누지 말아 주세요.</div>'+
   '</div>';
}
async function supSend(extra){
  const msg=$('supMsg'); msg.textContent='저장하는 중…'; msg.style.color='var(--mut)';
  const r=await gate({t:portalT, pin:portalPin, action:'update',
    sup_due_on:$('sd').value||null, sample_done_on:$('sc').value||null,
    make_done_on:$('mc').value||null, sup_note:$('sn').value, ...extra});
  if(r.error){ msg.textContent=r.error; msg.style.color='var(--red)'; return; }
  drawSupplierView(r);
  const m2=$('supMsg'); if(m2){ m2.textContent='저장했습니다. 발주처에 전달됐습니다.'; }
}
</script>
